<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Book Borrowing System</title>
</head>
<body>
  <input type="text" id="studentName" placeholder="Enter Student Name">
  <input type="text" id="bookName" placeholder="Enter Book Name">
  <button id="borrowBookBtn">Borrow Book</button>

  <ol id="resultsList">
  </ol>

  <script>
  let studentName = document.getElementById("studentName");
  let bookName = document.getElementById("bookName");
  let borrowBookBtn = document.getElementById("borrowBookBtn");
  let resultsList = document.getElementById("resultsList");

  let borrowedBooksArray = JSON.parse(localStorage.getItem("borrowedBooks")) || [];

  displayList();

  borrowBookBtn.addEventListener("click", function(){

    if(studentName.value === '' || bookName.value === ''){
      alert("Please fill in both Student Name and Book Name");
    } else {
      let info = {name: studentName.value, book: bookName.value};
      borrowedBooksArray.push(info);
      localStorage.setItem("borrowedBooks", JSON.stringify(borrowedBooksArray));
      displayList();
    }
  });

  function displayList(){
    resultsList.innerHTML = '';
    borrowedBooksArray.forEach((books, index) => {
    let li = document.createElement("li");
    li.innerHTML = `Student name is ${books.name} and book is ${books.book} <button onclick="returnBook(${index})">Return Book</button>`;
    resultsList.appendChild(li);
    });
  }

  function returnBook(index){
    borrowedBooksArray.splice(index, 1);
    localStorage.setItem("borrowedBooks", JSON.stringify(borrowedBooksArray));
    displayList();
  }
  
  </script>
</body>
</html>
