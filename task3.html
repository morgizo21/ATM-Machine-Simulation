<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Checker</title>

  <style>
  </style>
</head>
<body>
  <input type="password" id="password" placeholder="Enter password">
  <button id="checkPwdBtn">Check Password</button>
  
  <p id="results"></p>

  <script>
    let checkPwdBtn = document.getElementById("checkPwdBtn");
    let results = document.getElementById("results");

    checkPwdBtn.addEventListener("click", function(){
    let password = document.getElementById("password").value;

      let hasLetter = /[a-zA-Z]/.test(password);
      let hasNumber = /[0-9]/.test(password);
      let hasSpecialCharacter = /[!@#$%^&*(),.?":{}|<>]/.test(password);
      let isUpperCase = /[A-Z]/.test(password);
      let isLowerCase = /[a-z]/.test(password);

      if(password.length < 8){
        results.innerHTML = "Weak password.";
        results.style.backgroundColor = "red";
      } else if (password.length >= 8 && isUpperCase && isLowerCase &&        hasNumber && hasSpecialCharacter){
        results.innerHTML = "Strong password.";
        results.style.backgroundColor = "lime";
      }
        else if (password.length >= 8 && hasLetter && hasNumber){
        results.innerHTML = "Medium password.";
        results.style.backgroundColor = "orange";
      } else {
        results.innerHTML = "Weak password."
      }
    });


  </script>
</body>
</html>
